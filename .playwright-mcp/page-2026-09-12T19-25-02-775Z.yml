        - generic [ref=f8e201]:
          - paragraph
          - generic [ref=f8e202]: Identité digitale pour tous les tunisiens ! L’identité digitale sur mobile permet l’identification du demandeur de service en ligne d’une manière fiable, l’établissement simple de la signature électronique des documents, la réalisation des démarches administratives et la récupération des documents officiels en ligne d’une manière simple, 24 heures sur 24 et sans avoir à se déplacer à l’administration. L’application e-Houwiya permet à tous les Tunisiens résidents en Tunisie et à l’étranger, ayant 18 ans ou plus et détenteurs de carte d’identité nationale, d’obtenir une identité digitale sur mobile et de l’utiliser d’une manière sécurisée et simple. L’identité digitale sur mobile est liée à l’identifiant unique du citoyen et elle se base soit sur l’appareil téléphonique soit sur le numéro de téléphone pour la réception des codes de vérification. Les codes de vérification sont nécessaires dans chaque opération d’accès en ligne et de signature électronique effectuée en utilisant le certificat et les clés de signature du citoyen.
          - button "plus" [ref=f8e205] [cursor=pointer]
          - paragraph
